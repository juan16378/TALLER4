{% extends "base.html" %}
{% block title %}Iniciar sesion{% endblock %}
{% block content %}
  <h1>Iniciar sesion</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}
    {{ form.non_field_errors }}
    <button type="submit">Entrar</button>
  </form>
  <p>&iquest;No tienes cuenta? <a href="{% url 'accounts:register' %}">Registrate aqui</a></p>
{% endblock %}
